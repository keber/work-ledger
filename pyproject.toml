[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "work-ledger"
version = "0.1.0"
description = "Local ledger of work threads: git inventory of repos, worktrees and branches."
requires-python = ">=3.14"
dependencies = []

[project.scripts]
work-ledger = "work_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
work_ledger = ["prompts/*.md"]
